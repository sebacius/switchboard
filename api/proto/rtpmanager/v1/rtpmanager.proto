syntax = "proto3";

package rtpmanager.v1;

option go_package = "github.com/sebas/switchboard/pkg/rtpmanager/v1;rtpmanagerv1";

// RTPManagerService handles media session lifecycle for SIP calls.
// Manages RTP port allocation, SDP generation, and audio streaming.
service RTPManagerService {
  // CreateSession allocates RTP ports and returns SDP for the session.
  // Called during INVITE processing to get media endpoint for SDP answer.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // DestroySession releases all resources associated with a session.
  // Called on BYE or call termination.
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);

  // PlayAudio starts audio playback to the remote endpoint.
  // Returns a stream of events including progress and completion.
  rpc PlayAudio(PlayAudioRequest) returns (stream PlaybackEvent);

  // StopAudio immediately stops any active playback for a session.
  rpc StopAudio(StopAudioRequest) returns (StopAudioResponse);

  // Health checks if the service is operational.
  rpc Health(HealthRequest) returns (HealthResponse);

  // UpdateSessionRemote updates the remote endpoint for an existing session.
  // Used for B2BUA: B-leg session is created without remote info, then updated
  // when the 200 OK with SDP arrives from the callee.
  rpc UpdateSessionRemote(UpdateSessionRemoteRequest) returns (UpdateSessionRemoteResponse);

  // BridgeMedia connects two sessions for bidirectional RTP forwarding.
  // Packets received on session A are forwarded to session B's remote endpoint
  // and vice versa. Both sessions must exist and have valid remote endpoints.
  rpc BridgeMedia(BridgeMediaRequest) returns (BridgeMediaResponse);

  // UnbridgeMedia disconnects two bridged sessions.
  // Each session continues to exist but packets are no longer forwarded.
  rpc UnbridgeMedia(UnbridgeMediaRequest) returns (UnbridgeMediaResponse);

  // PlayTTS generates speech from text using a TTS server and streams it.
  // The audio is fetched from the configured TTS server, resampled to 8kHz,
  // encoded to PCMU, and streamed as RTP packets.
  rpc PlayTTS(PlayTTSRequest) returns (stream PlaybackEvent);

  // Listen captures incoming RTP audio until silence is detected,
  // then transcribes it using the configured ASR server (Whisper).
  rpc Listen(ListenRequest) returns (ListenResponse);
}

// Session Management

message CreateSessionRequest {
  // Call-ID from SIP for correlation
  string call_id = 1;

  // Remote endpoint from client SDP
  string remote_addr = 2;
  int32 remote_port = 3;

  // Codecs offered by remote party (payload type strings: "0", "8", etc.).
  // Superseded by `offered`, which carries what each payload type MEANS.
  // Retained so an older signaling server still negotiates audio correctly.
  repeated string offered_codecs = 4;

  // Full codec offer including rtpmap. Bare payload-type numbers are not enough
  // for dynamic types: telephone-event is a dynamic payload type, so 101 in one
  // offer and 96 in another can name the same thing, and only the rtpmap says
  // which. Without this, DTMF cannot be negotiated at all.
  repeated CodecOffer offered = 5;
}

// CodecOffer is one m-line format together with the rtpmap that gives it
// meaning.
message CodecOffer {
  // Payload type from the m= line.
  int32 payload_type = 1;

  // Encoding name from a=rtpmap, e.g. "PCMU" or "telephone-event". Empty for a
  // static payload type carrying no rtpmap, where the number defines the codec.
  string encoding_name = 2;

  // Clock rate from a=rtpmap, e.g. 8000.
  int32 clock_rate = 3;

  // Format parameters from a=fmtp, e.g. "0-15" for telephone-event.
  string fmtp = 4;
}

message CreateSessionResponse {
  // Unique session ID for subsequent calls
  string session_id = 1;

  // Allocated local endpoint for SDP answer
  string local_addr = 2;
  int32 local_port = 3;

  // Selected codec after negotiation
  string selected_codec = 4;

  // Complete SDP body for SIP response
  bytes sdp_body = 5;

  // Status
  SessionStatus status = 6;

  // Negotiated telephone-event payload type, or 0 when the offer contained none.
  // Zero means this leg has no RFC 4733 transport, so digit collection on it
  // must report that rather than waiting for digits that cannot arrive.
  int32 telephone_event_pt = 7;
}

message DestroySessionRequest {
  string session_id = 1;
  TerminateReason reason = 2;
}

message DestroySessionResponse {
  string session_id = 1;
  SessionStatus status = 2;
}

// Audio Playback

message PlayAudioRequest {
  string session_id = 1;
  string file_path = 2;       // Single file (for backwards compatibility)
  bool loop = 3;              // Loop the playlist indefinitely
  repeated string files = 4;  // Playlist of files (preferred over file_path)
}

message PlaybackEvent {
  string session_id = 1;

  oneof event {
    PlaybackStarted started = 2;
    PlaybackProgress progress = 3;
    PlaybackCompleted completed = 4;
    PlaybackError error = 5;
    PlaybackStopped stopped = 6;
  }
}

message PlaybackStarted {
  int32 total_frames = 1;
  int32 duration_ms = 2;
}

message PlaybackProgress {
  int32 frames_sent = 1;
  float percent_complete = 2;
}

message PlaybackCompleted {
  int32 total_frames_sent = 1;
  int32 duration_ms = 2;
}

message PlaybackError {
  string code = 1;
  string message = 2;
}

message PlaybackStopped {
  string reason = 1;
  int32 frames_sent = 2;
}

message StopAudioRequest {
  string session_id = 1;
}

message StopAudioResponse {
  string session_id = 1;
  bool was_playing = 2;
}

// Text-to-Speech

message PlayTTSRequest {
  string session_id = 1;
  string text = 2;       // Text to synthesize
  string voice = 3;      // Voice name (e.g., "alloy", "echo", "nova")
}

// Health Check

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  int32 active_sessions = 2;
  int32 available_ports = 3;
}

// Common Types

message SessionStatus {
  SessionState state = 1;
  string error_message = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_CREATED = 1;
  SESSION_STATE_ACTIVE = 2;
  SESSION_STATE_TERMINATED = 3;
  SESSION_STATE_ERROR = 4;
  // Bridge-specific states
  SESSION_STATE_PENDING_REMOTE = 5;  // Waiting for remote endpoint info
  SESSION_STATE_BRIDGED = 6;         // Part of an active bridge
}

enum TerminateReason {
  TERMINATE_REASON_UNSPECIFIED = 0;
  TERMINATE_REASON_NORMAL = 1;
  TERMINATE_REASON_BYE = 2;
  TERMINATE_REASON_CANCEL = 3;
  TERMINATE_REASON_ERROR = 4;
  TERMINATE_REASON_TIMEOUT = 5;
}

// Bridge Operations

message UpdateSessionRemoteRequest {
  string session_id = 1;
  string remote_addr = 2;
  int32 remote_port = 3;

  // Codecs the callee answered with, for a B-leg created before its remote was
  // known. Carries the same rtpmap detail as the offer so a bridged leg's
  // telephone-event payload type is knowable.
  repeated CodecOffer answered = 4;
}

message UpdateSessionRemoteResponse {
  string session_id = 1;
  SessionStatus status = 2;
}

message BridgeMediaRequest {
  // Session ID for leg A (typically caller side)
  string session_a_id = 1;
  // Session ID for leg B (typically callee side)
  string session_b_id = 2;
}

message BridgeMediaResponse {
  // Unique bridge ID for managing the bridge
  string bridge_id = 1;
  SessionStatus status = 2;
}

message UnbridgeMediaRequest {
  // Can specify by bridge_id OR by session_id
  string bridge_id = 1;
  string session_id = 2;
}

message UnbridgeMediaResponse {
  string bridge_id = 1;
  SessionStatus status = 2;
}

// Speech Recognition (ASR)

message ListenRequest {
  string session_id = 1;
  int32 max_duration_ms = 2;     // Maximum recording duration (default 10000ms)
  int32 silence_timeout_ms = 3;  // Stop after this much silence (default 1500ms)
  int32 silence_threshold = 4;   // Energy threshold for silence detection (default auto)
}

message ListenResponse {
  string session_id = 1;
  string text = 2;               // Transcribed text from ASR
  int32 duration_ms = 3;         // How long caller spoke
  bool timeout = 4;              // True if max_duration was reached
}
