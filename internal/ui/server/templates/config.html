<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        html { scroll-behavior: smooth; }
        .tab-active {
            background-color: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #ffffff;
        }
        textarea {
            tab-size: 4;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <!-- Fixed Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-slate-800 border-b border-slate-700 px-6 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Switchboard</h1>
                    <p class="text-xs text-slate-400">Configuration Editor</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <!-- Reload Button -->
                <button hx-post="/admin/config/reload?server={{.SelectedServer}}"
                        hx-target="#reload-status"
                        hx-swap="innerHTML"
                        class="inline-flex items-center px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 transition-colors text-sm font-medium">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Reload Config
                </button>
                <a href="/" class="inline-flex items-center px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition-colors text-sm text-slate-300">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Dashboard
                </a>
            </div>
        </div>
    </header>

    <div class="flex pt-14">
        <!-- Fixed Sidebar -->
        <aside class="fixed left-0 top-14 bottom-0 w-56 bg-slate-800/50 border-r border-slate-700 overflow-y-auto">
            <nav class="py-4">
                <div class="px-4 mb-4">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Configuration</p>
                </div>
                <ul class="space-y-1 px-2">
                    <li>
                        <button hx-get="/admin/config/partials/tenants?server={{.SelectedServer}}"
                                hx-target="#config-content"
                                hx-swap="innerHTML"
                                onclick="setActiveTab(this)"
                                class="config-tab {{if eq .ActiveTab "tenants"}}tab-active{{end}} w-full flex items-center px-3 py-2.5 rounded-lg border-l-2 border-transparent hover:bg-slate-700/50 transition-colors group text-left">
                            <svg class="w-5 h-5 text-slate-400 group-hover:text-blue-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                            <span class="text-sm text-slate-300 group-hover:text-white">Tenants</span>
                        </button>
                    </li>
</ul>

                {{if gt (len .Backends) 1}}
                <div class="mt-6 px-4">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Server</p>
                    <select onchange="window.location.href='/admin/config?server='+this.value"
                            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none">
                        {{range .Backends}}
                        <option value="{{.Name}}" {{if eq .Name $.SelectedServer}}selected{{end}}>{{.Name}}</option>
                        {{end}}
                    </select>
                </div>
                {{end}}
            </nav>

            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-700 bg-slate-800/80">
                <p class="text-xs text-slate-500 text-center">Server: {{.SelectedServer}}</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 ml-56 p-6">
            <!-- Reload Status: the result of pressing Reload -->
            <div id="reload-status" class="mb-4"></div>

            <!-- Configuration drift: is what is on disk what is serving calls?
                 Asked of the signaling server rather than remembered here, so a
                 second operator, a UI restart or a signaling restart all get the
                 same answer. -->
            <div id="reload-banner"
                 hx-get="/admin/config/partials/reload-banner?server={{.SelectedServer}}"
                 hx-trigger="load, config-saved from:body, every 30s"
                 hx-swap="innerHTML"></div>

            <!-- Tab Content -->
            <div id="config-content"
                 hx-get="/admin/config/partials/{{.ActiveTab}}?server={{.SelectedServer}}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="flex items-center justify-center py-20">
                    <svg class="animate-spin w-8 h-8 text-slate-500" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </main>
    </div>

    <script>
    function setActiveTab(el) {
        document.querySelectorAll('.config-tab').forEach(t => {
            t.classList.remove('tab-active');
        });
        el.classList.add('tab-active');
    }
    </script>
</body>
</html>
