{{define "content"}}
            <!-- Reload Status: the result of pressing Reload -->
            <div id="reload-status" class="mb-4"></div>

            <!-- Configuration drift: is what is on disk what is serving calls?
                 Asked of the signaling server rather than remembered here, so a
                 second operator, a UI restart or a signaling restart all get the
                 same answer. -->
            <div id="reload-banner"
                 hx-get="/admin/config/partials/reload-banner?server={{.SelectedServer}}"
                 hx-trigger="load, config-saved from:body, every 30s"
                 hx-swap="innerHTML"></div>

            <!-- Tab Content -->
            <div id="config-content"
                 hx-get="/admin/config/partials/{{.ActiveTab}}?server={{.SelectedServer}}{{.TabQuery}}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="flex items-center justify-center py-20">
                    <svg class="animate-spin w-8 h-8 text-slate-500" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
{{end}}

{{define "header_actions"}}
<button hx-post="{{.Layout.Link "/admin/config/reload"}}"
        hx-target="#reload-status"
        hx-swap="innerHTML"
        class="inline-flex items-center px-3 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 transition-colors text-sm font-medium">
    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
    </svg>
    Reload Config
</button>
{{end}}

{{define "head_extra"}}
    <!-- The flow canvas. Pinned to an exact version and loaded here rather than
         in the tab's partial, so the editor's script can never run before the
         library it needs has arrived. -->
    <link rel="stylesheet" href="https://unpkg.com/drawflow@0.0.60/dist/drawflow.min.css">
    <script src="https://unpkg.com/drawflow@0.0.60/dist/drawflow.min.js"></script>
{{end}}
