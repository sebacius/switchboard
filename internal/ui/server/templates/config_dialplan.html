<div>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-bold text-white">Dialplan Configuration</h2>
            <p class="text-sm text-slate-400 mt-1">Call routing rules and actions (dialplan.json)</p>
        </div>
    </div>

    {{if .Success}}
    <div class="mb-4 flex items-center px-4 py-3 rounded-lg bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 text-sm">
        <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        {{.Success}}
    </div>
    {{end}}

    {{if .Error}}
    <div class="mb-4 flex items-center px-4 py-3 rounded-lg bg-red-500/20 border border-red-500/30 text-red-300 text-sm">
        <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {{.Error}}
    </div>
    {{end}}

    <div class="mb-4 flex items-center px-4 py-3 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300 text-sm">
        <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
        </svg>
        <span>This file must contain valid JSON. After saving, use <strong class="font-semibold">Reload Config</strong> to apply changes to the running server.</span>
    </div>

    <form hx-post="/admin/config/dialplan/save?server={{.Server}}"
          hx-target="#config-content"
          hx-swap="innerHTML">
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 bg-slate-700/50 border-b border-slate-700">
                <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                    <span class="text-sm font-medium text-slate-300">dialplan.json</span>
                </div>
                <span class="text-xs text-slate-500">JSON</span>
            </div>
            <textarea name="content"
                      rows="35"
                      class="w-full bg-slate-900 text-slate-200 font-mono text-sm p-4 focus:outline-none resize-y border-none"
                      placeholder='{"version": "1.0", "routes": []}'
                      spellcheck="false">{{.Content}}</textarea>
        </div>

        <div class="mt-4 flex items-center justify-end space-x-3">
            <button type="submit"
                    class="inline-flex items-center px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 transition-colors text-white text-sm font-medium shadow-lg">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Save Dialplan
            </button>
        </div>
    </form>
</div>
