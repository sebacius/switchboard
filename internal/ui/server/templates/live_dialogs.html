{{define "content"}}
<section id="dialogs" class="mb-10">
    <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-semibold text-white">Dialogs</h2>
                <p class="text-sm text-slate-400">Active SIP dialogs{{if .MultiBackend}} across all servers{{end}}</p>
            </div>
            <div class="w-8 h-8 bg-amber-500/20 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
            </div>
        </div>
        <div id="dialogs-container" hx-get="{{.Layout.Link "/admin/partials/dialogs"}}" hx-trigger="every 3s" hx-swap="innerHTML">
            {{template "dialogs" .}}
        </div>
    </div>
</section>
{{end}}
