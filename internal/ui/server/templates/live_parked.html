{{define "content"}}
<section id="parkedcalls" class="mb-10">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-semibold text-white">Parked Calls</h2>
            <p class="text-sm text-slate-400">Calls on hold in parking slots{{if .MultiBackend}} across all servers{{end}}</p>
        </div>
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 text-xs text-slate-500">
                <span class="w-2 h-2 bg-violet-500 rounded-full animate-pulse"></span>
                <span>Live updates</span>
            </div>
            <div class="w-8 h-8 bg-violet-500/20 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                </svg>
            </div>
        </div>
    </div>
    <div id="parkedcalls-container" hx-get="{{.Layout.Link "/admin/partials/parkedcalls"}}" hx-trigger="every 3s" hx-swap="innerHTML">
        {{template "parkedcalls" .}}
    </div>
</section>
{{end}}
