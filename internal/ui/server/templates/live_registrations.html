{{define "content"}}
<section id="registrations" class="mb-10">
    <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-semibold text-white">Registrations</h2>
                <p class="text-sm text-slate-400">Active SIP registrations{{if .MultiBackend}} across all servers{{end}}</p>
            </div>
            <div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
        </div>
        <div id="registrations-container" hx-get="{{.Layout.Link "/admin/partials/registrations"}}" hx-trigger="every 5s" hx-swap="innerHTML">
            {{template "registrations" .}}
        </div>
    </div>
</section>
{{end}}
