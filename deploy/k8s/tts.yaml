# TTS Server (OpenAI-compatible speech API)
# Uses openedai-speech with Piper voices
# Provides: tts.switchboard.svc.cluster.local:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: tts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switchboard
      app.kubernetes.io/component: tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switchboard
        app.kubernetes.io/component: tts
    spec:
      containers:
        - name: tts
          image: ghcr.io/matatonic/openedai-speech:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: tts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: tts
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
