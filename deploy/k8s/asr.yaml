# ASR Server (Whisper Speech-to-Text)
# Uses faster-whisper-server (OpenAI-compatible transcription API)
# Provides: asr.switchboard.svc.cluster.local:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: asr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switchboard
      app.kubernetes.io/component: asr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switchboard
        app.kubernetes.io/component: asr
    spec:
      containers:
        - name: asr
          image: fedirz/faster-whisper-server:latest-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: WHISPER__MODEL
              value: "Systran/faster-whisper-tiny"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: asr
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: asr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: asr
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
