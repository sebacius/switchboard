services:
  ollama:
    image: ollama/ollama
    container_name: switchboard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    container_name: switchboard-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'ollama pull "$$OLLAMA_MODEL"'
    restart: "no"

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: switchboard-whisper
    ports:
      - "8001:8000"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny}
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

  piper:
    image: ghcr.io/matatonic/openedai-speech
    container_name: switchboard-piper
    ports:
      - "8000:8000"
    volumes:
      - piper-voices:/app/voices
    restart: unless-stopped

volumes:
  ollama-models:
  whisper-models:
  piper-voices:
